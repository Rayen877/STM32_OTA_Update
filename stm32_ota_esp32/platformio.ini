[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = COM6
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.2

build_flags =
    -DCORE_DEBUG_LEVEL=3
